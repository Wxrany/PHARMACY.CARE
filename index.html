<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For N'Mook 👩🏻‍⚕️ - Rx Encouragement</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt & Noto Serif Thai for authentic rx look -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap">

    <style>
        * {
            font-family: 'Prompt', sans-serif;
        }

        .font-rx {
            font-family: 'Noto Serif Thai', Georgia, serif;
        }

        /* Clean minimal pink medical background */
        body {
            background-color: #fdf2f8;
            background-image: 
                radial-gradient(#fbcfe8 1.2px, transparent 1.2px),
                radial-gradient(#fbcfe8 1.2px, #fdf2f8 1.2px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            min-height: 100vh;
        }

        .mascot-bounce {
            animation: mascotFloat 3s ease-in-out infinite;
        }

        @keyframes mascotFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1.2deg); }
        }

        .mascot-blink {
            animation: eyeBlink 3.8s infinite;
            transform-origin: center;
        }

        @keyframes eyeBlink {
            0%, 95%, 100% { transform: scaleY(1); }
            97.5% { transform: scaleY(0.08); }
        }

        .pill-container {
            perspective: 1000px;
        }

        .pill-capsule {
            position: relative;
            width: 124px;
            height: 48px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pill-capsule:hover {
            transform: scale(1.06);
        }

        .pill-shake {
            animation: shake 0.4s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }

        .pill-left {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: #ec4899;
            border-radius: 24px 0 0 24px;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.1);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10;
        }

        .pill-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: #f43f5e;
            border-radius: 0 24px 24px 0;
            box-shadow: inset 2px 0 4px rgba(0,0,0,0.08);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10;
        }

        .pill-split .pill-left {
            transform: translateX(-30px) rotate(-22deg);
        }

        .pill-split .pill-right {
            transform: translateX(30px) rotate(22deg);
        }

        .quote-pop {
            animation: popOut 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: top center;
        }

        @keyframes popOut {
            0% {
                opacity: 0;
                transform: translateY(-16px) scale(0.88);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .cursor-blink::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #ec4899;
            font-weight: bold;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .rx-stamp {
            border: 2px solid #fbcfe8;
            color: #f472b6;
            transform: rotate(-8deg);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 min-h-screen">

    <div class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl shadow-pink-100/60 border border-pink-100 p-6 sm:p-8 overflow-hidden">
        
        <!-- Header: Medical Clinic / Pharmacy Brand -->
        <div class="flex items-start justify-between border-b border-pink-100 pb-5 mb-5">
            <div>
                <div class="flex items-center gap-2 text-pink-600 font-bold text-lg tracking-tight">
                    <span class="text-2xl font-rx font-bold italic">℞</span>

                </div>
                <p class="text-[11px] text-pink-400 mt-0.5 tracking-wide">DEPARTMENT OF HAPPY PILLS</p>
            </div>
            <div class="text-right">
                <span class="inline-block bg-pink-50 text-pink-600 text-[10px] font-mono px-2.5 py-1 rounded-md border border-pink-200/60">
                    RX NO. 2026-888
                </span>
                <p class="text-[10px] text-slate-400 mt-1">DATE: <span id="currentDate">16/10/2026</span></p>
            </div>
        </div>

        <div class="flex items-center gap-3.5 mb-5 bg-pink-50/60 p-3.5 rounded-xl border border-pink-100/80">
            
            <div class="mascot-bounce shrink-0 relative flex justify-center items-center">

                            <stop offset="0%" stop-color="#4a2e1b"/>

                    <!-- Soft Aura Glow -->
                    <circle cx="50" cy="46" r="38" fill="#fbcfe8" opacity="0.45"/>
                    
                    <!-- Chinese Hair Buns (ทรงผมอาหมวย ซาลาเปาสองข้างน่ารักๆ) -->

                        <!-- Left Hair Bun -->
                        <circle cx="21" cy="33" r="11" fill="url(#hairGradAhMuay)"/>
                        <circle cx="21" cy="33" r="12" stroke="#ec4899" stroke-width="1.8" fill="none"/>

                        <!-- Right Hair Bun -->
                        <circle cx="79" cy="33" r="11" fill="url(#hairGradAhMuay)"/>
                        <circle cx="79" cy="33" r="12" stroke="#ec4899" stroke-width="1.8" fill="none"/>
                        <path d="M 73 36 C 76 39 82 39 85 36" stroke="#fda4af" stroke-width="1" fill="none"/>
                    </g>

                    <!-- Cute Chibi Head Structure -->
                    <circle cx="50" cy="45" r="26" fill="#fff1f2"/>
                    
                    <!-- Ears with Hoop Earring -->
                    <ellipse cx="23" cy="46" rx="3.8" ry="5.2" fill="#ffe4e6"/>
                    <ellipse cx="77" cy="46" rx="3.8" ry="5.2" fill="#ffe4e6"/>
                    <path d="M 22 47 C 19 49.5 19 53.5 22 55" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" fill="none"/>

                    <!-- Soft Peach Pink Blushing Cheeks -->
                    <ellipse cx="33" cy="50" rx="7.2" ry="4" fill="url(#pinkBlushSoft)"/>
                    <ellipse cx="67" cy="50" rx="7.2" ry="4" fill="url(#pinkBlushSoft)"/>

                    <!-- Front Hair & Swept Bangs -->
                    <path d="M 24 38 C 24 20 76 20 76 38 C 76 26 64 19 50 19 C 36 19 24 26 24 38 Z" fill="url(#hairGradAhMuay)"/>
                    <path d="M 26 32 Q 38 45 49 32 C 37 28 30 30 26 32 Z" fill="#5c3a21"/>
                    <path d="M 74 32 Q 62 45 51 32 C 63 28 70 30 74 32 Z" fill="#5c3a21"/>
                    <!-- Side Locks Framing Face -->
                    <path d="M 23 37 C 19 49 22 61 25 67 C 26 59 25 48 26 37 Z" fill="url(#hairGradAhMuay)"/>
                    <path d="M 77 37 C 81 49 78 61 75 67 C 74 59 75 48 74 37 Z" fill="url(#hairGradAhMuay)"/>

                    <!-- Pharmacist Cap with Cross Emblem -->
                    <path d="M 28 26 C 28 16 72 16 72 26 L 75 32 L 25 32 Z" fill="#f43f5e"/>
                    <path d="M 28 30 H 72" stroke="#fda4af" stroke-width="1.5"/>
                    <circle cx="50" cy="23" r="4.5" fill="#ffffff"/>
                    <path d="M 47.5 23 H 52.5 M 50 20.5 V 25.5" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/>

                    <!-- Large Sparkly Anime Eyes -->
                    <g class="mascot-blink">
                        <!-- Left Eye -->
                        <ellipse cx="36" cy="42" rx="5" ry="6" fill="#291810"/>
                        <circle cx="37.8" cy="39.2" r="2.3" fill="#ffffff"/>
                        <circle cx="34" cy="44.2" r="1.1" fill="#ffffff"/>
                        <path d="M 29.5 35 Q 36 32 42.5 35" stroke="#291810" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <path d="M 29 36.5 L 27 34.5" stroke="#291810" stroke-width="1.4" stroke-linecap="round"/>

                        <!-- Right Eye -->
                        <ellipse cx="64" cy="42" rx="5" ry="6" fill="#291810"/>
                        <circle cx="65.8" cy="39.2" r="2.3" fill="#ffffff"/>
                        <circle cx="62" cy="44.2" r="1.1" fill="#ffffff"/>
                        <path d="M 57.5 35 Q 64 32 70.5 35" stroke="#291810" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <path d="M 71 36.5 L 73 34.5" stroke="#291810" stroke-width="1.4" stroke-linecap="round"/>
                    </g>
                    
                    <!-- Gentle Sweet Smile (ยิ้มน้อยลง ละมุนตา ไม่กว้างเกินไป) -->
                    <path d="M 42 49 Q 50 54 58 49 Z" fill="#ffffff" stroke="#291810" stroke-width="1.2"/>
                    <!-- Braces Archwire & Colored Brackets -->
                    <path d="M 42.5 50.5 Q 50 53 57.5 50.5" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" fill="none"/>
                    <rect x="44" y="50" width="1.3" height="1.3" fill="#ec4899" rx="0.3"/>
                    <rect x="47" y="50.8" width="1.3" height="1.3" fill="#f43f5e" rx="0.3"/>
                    <rect x="49.35" y="51.2" width="1.3" height="1.3" fill="#ec4899" rx="0.3"/>
                    <rect x="51.7" y="50.8" width="1.3" height="1.3" fill="#3b82f6" rx="0.3"/>
                    <rect x="54.7" y="50" width="1.3" height="1.3" fill="#ec4899" rx="0.3"/>

                    <!-- Body & White Pharmacist Gown -->
                    <path d="M 26 102 C 26 73 74 73 74 102 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
                    <!-- Collars -->
                    <path d="M 36 73 L 44 85 L 32 83 Z" fill="#fff1f2" stroke="#f472b6" stroke-width="1.2"/>
                    <path d="M 64 73 L 56 85 L 68 83 Z" fill="#fff1f2" stroke="#f472b6" stroke-width="1.2"/>
                    <!-- Inner Pink Scrub Top -->
                    <path d="M 44 73 L 50 81 L 56 73 Z" fill="#f43f5e"/>
                    
                    <!-- Stethoscope & Heart Pendant -->
                    <path d="M 35 74 C 35 89 65 89 65 74" stroke="#ec4899" stroke-width="2.3" stroke-linecap="round" fill="none"/>
                    <circle cx="50" cy="88" r="4.8" fill="#fb7185" stroke="#ffffff" stroke-width="1.5"/>
                    <circle cx="50" cy="88" r="2" fill="#ffffff"/>
                    
                    <!-- Cute Hands Holding Heart -->
                    <path d="M 50 76 C 44 70 38 76 50 86 C 62 76 56 70 50 76 Z" fill="#f43f5e"/>
                    <path d="M 47 76 C 44 74 42 76 47 80 Z" fill="#ffffff" opacity="0.5"/>
                    <circle cx="39" cy="80" r="4" fill="#fff1f2" stroke="#fbcfe8" stroke-width="1"/>
                    <circle cx="61" cy="80" r="4" fill="#fff1f2" stroke="#fbcfe8" stroke-width="1"/>
                </svg>
            </div>

            <!-- Patient Details -->
            <div class="space-y-1.5 text-xs text-slate-600 flex-1">
                <div class="flex justify-between items-center border-b border-pink-200/50 pb-1">
                    <span class="text-pink-400 font-mono text-[10px]">PATIENT:</span>
                    <span class="font-semibold text-slate-800">คุณเภสัชคนเก่ง 🥼</span>
                </div>
                <div class="flex justify-between items-center border-b border-pink-200/50 pb-1">
                    <span class="text-pink-400 font-mono text-[10px]">DIAGNOSIS:</span>
                    <span class="font-medium text-pink-600">เหนื่อยล้า ท้อแท้</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-pink-400 font-mono text-[10px]">DOSAGE:</span>
                    <span class="font-medium text-slate-600">รับประทานเพื่อเพิ่มกำลังใจ🤍</span>
                </div>
            </div>
        </div>

        <div class="my-6 text-center relative" id="capsuleSection">
            <p class="text-[11px] text-pink-400 mb-3 tracking-wide flex items-center justify-center gap-1">
                <i class="fa-solid fa-sparkles text-pink-500 animate-pulse"></i>
                <span>แตะที่แคปซูลเพื่อรับยา</span>
            </p>

            <div class="pill-container mb-4">
                <div id="pillCapsule" class="pill-capsule" onclick="dispenseDose()">
                    <div class="pill-left flex items-center justify-center">
                        <span class="text-white/70 text-[10px] font-mono font-semibold">500mg</span>
                    </div>
                    <div class="pill-right flex items-center justify-center">
                        <i class="fa-solid fa-heart text-white/70 text-[11px]"></i>
                    </div>
                </div>
            </div>

            <!-- Pop-out Prescription Quote Box -->
            <div id="quoteCardContainer" class="hidden quote-pop bg-pink-50/80 border border-pink-200/80 rounded-xl p-4 text-left relative mt-4 shadow-sm">
                <div class="flex items-center gap-1.5 mb-2 text-pink-600 text-xs font-semibold">
                    <i class="fa-solid fa-capsules"></i>
                    <span>PRESCRIPTION DETAILS:</span>
                </div>
                <p id="quoteBox" class="text-slate-700 text-xs sm:text-sm leading-relaxed font-medium min-h-[48px]">
                </p>
            </div>
        </div>

        <div class="mt-8 pt-4 border-t border-pink-100 flex items-end justify-between">
            <div>
                <div class="rx-stamp px-2.5 py-1 rounded text-[10px] font-mono tracking-wider uppercase font-bold inline-block mb-1">
                    VERIFIED Rx
                </div>
                <p class="text-[10px] text-pink-400">*ข้อควรระวัง: ห้ามยอมแพ้เด็ดขาด!</p>
            </div>
            <div class="text-right">
                <div class="font-rx italic text-pink-600 font-bold text-sm tracking-wide border-b border-pink-300 pb-0.5 mb-1 inline-block">
                    P'Woonsen
                </div>
                <p class="text-[10px] text-slate-400">Waranya Y.</p>
            </div>
        </div>

    </div>

    <script>
        // Set current date in DD/MM/YYYY format
        const today = new Date();
        const formattedDate = `${today.getDate().toString().padStart(2, '0')}/${(today.getMonth()+1).toString().padStart(2, '0')}/${today.getFullYear()}`;
        document.getElementById('currentDate').innerText = formattedDate;

        // Quotes dataset
        const quotes = [
            "ก๊อกๆ ส่งดอกไม้มาให้กำลังใจคับ! 🌷🌻",
            "หนูเป็นคนยิ้มหวานมาก เพราะงั้นหนูต้องยิ้มเยอะๆๆ 😸",
            "เยี่ยมมากวันนี้ทั้งฝึกงานและอ่านหนังสือ แต่อย่าลืมพักผ่อนเยอะเยอะด้วยนะ 🌙",
            "วันนี้เป็นไงบ้างฝึกงานสนุกมั้ย มาเอาสิบโป้งจากพี่มา 👍🏻",
            "อ่านวิชาไหนแล้วปวดหัว มาพักคุยเล่นกับพี่ได้นะ555",
            "เพราะเป็นหนูพี่เลยเชื่อว่า หนูทำได้แน่นอน 😄 ",
            "วันนี้เหนื่อยมั้ย พี่เป็นกำลังใจให้นะ สู้ดิวะ!!",
            "พักสายตาสักแป๊บนะ หนูกำลังเข้าใกล้คณะเภสัชไปอีกขั้นแล้ว ✨"
        ];

        let lastIndex = -1;
        let isTyping = false;
        let typingTimeout = null;

        // Subtle pop audio sound synthesizer
        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(920, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        // Particle Burst (Pink & Pastel Tones)
        function triggerParticles() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 32,
                    spread: 65,
                    origin: { y: 0.55 },
                    colors: ['#ec4899', '#f43f5e', '#f472b6', '#fbcfe8'],
                    shapes: ['circle'],
                    scalar: 0.85
                });
            }
        }

        // Typewriter Effect
        function typeWriter(text, elementId, speed = 30) {
            const element = document.getElementById(elementId);
            if (!element) return;

            element.innerText = '';
            element.classList.add('cursor-blink');
            isTyping = true;
            
            let i = 0;
            if (typingTimeout) clearTimeout(typingTimeout);

            function type() {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(type, speed);
                } else {
                    element.classList.remove('cursor-blink');
                    isTyping = false;
                }
            }
            type();
        }

        // Capsule Dispense Function
        function dispenseDose() {
            if (isTyping) return;

            const pill = document.getElementById("pillCapsule");
            const quoteCardContainer = document.getElementById("quoteCardContainer");

            pill.classList.add("pill-shake");
            playPopSound();

            setTimeout(() => {
                pill.classList.remove("pill-shake");
                pill.classList.add("pill-split");

                triggerParticles();

                quoteCardContainer.classList.remove("hidden", "quote-pop");
                void quoteCardContainer.offsetWidth;
                quoteCardContainer.classList.add("quote-pop");

                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * quotes.length);
                } while (randomIndex === lastIndex && quotes.length > 1);
                lastIndex = randomIndex;

                typeWriter(quotes[randomIndex], "quoteBox", 30);

                setTimeout(() => {
                    pill.classList.remove("pill-split");
                }, 1000);

            }, 350);
        }
    </script>
</body>
</html>
